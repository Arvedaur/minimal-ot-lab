# Asama 5 - Telegraf: Modbus input -> InfluxDB v2 output (firewall uzerinden)

[agent]
  interval = "5s"
  round_interval = true
  metric_batch_size = 100
  flush_interval = "5s"
  omit_hostname = false

# --- INPUT: OpenPLC'den Modbus TCP okuma (plc_net uzerinden, dogrudan) ---
[[inputs.modbus]]
  ## Telegraf 1.31 modbus plugin'inde "name" (cihaz adi) ZORUNLU bir alan -
  ## name_override'dan farkli, bos birakilirsa "device name is empty" hatasiyla
  ## crash-loop'a girer (canli dogrulandi).
  name = "openplc-turbine"
  name_override = "turbine"
  controller = "tcp://openplc:502"
  slave_id = 1
  timeout = "3s"

  # Bolum 6 - Baslangic Register Haritasi (holding registers, 0-based Modbus adresi)
  #
  # ONEMLI: klasik OpenPLC'de holding-register adres uzayi ST'deki %MW/%QW
  # isimlendirmesiyle DEGIL, sabit bir offset ile bolunur (core/modbus.cpp -
  # ReadHoldingRegisters/writeToRegisterWithoutLocking):
  #   0    - 1023  -> %QW  (int_output[position])
  #   1024 - 2047  -> %MW  (int_memory[position - 1024])
  #   2048 - 4095  -> %MD (32-bit)     4096 - 8191 -> %ML (64-bit)
  # Bu program TUM analog degiskenlerini %MW0-%MW4 olarak tanimliyor, yani
  # gercek Modbus adresleri 1024 (wind_speed) .. 1028 (operating_state) olur -
  # adres 0-4 DEGIL (bu adresler hicbir %QW tanimlanmadigi icin hep 0 doner,
  # bu yanlisi biz de canli olarak yasadik - degerler "donuyor" gibi
  # gorunuyordu cunku hep bos/varsayilan %QW alanini okuyorduk).
  # NOT: Telegraf 1.31'de "scale" alani dokumanda opsiyonel gorunse de,
  # bos birakilirsa 0.0 varsayiliyor ve "invalid scale '0.000000'" hatasiyla
  # crash-loop'a giriyor (canli dogrulandi) - olcekleme zaten asagidaki
  # starlark processor'de yapildigi icin burada scale=1.0 (degistirmeden
  # gecir) ile aciyoruz.
  holding_registers = [
    { name = "wind_speed_raw",         byte_order = "AB", data_type = "UINT16", scale = 1.0, address = [1024] },
    { name = "rotor_speed_raw",        byte_order = "AB", data_type = "UINT16", scale = 1.0, address = [1025] },
    { name = "active_power_kw",        byte_order = "AB", data_type = "UINT16", scale = 1.0, address = [1026] },
    { name = "generator_temp_raw",     byte_order = "AB", data_type = "UINT16", scale = 1.0, address = [1027] },
    { name = "operating_state",        byte_order = "AB", data_type = "UINT16", scale = 1.0, address = [1028] },
  ]

  # Bolum 6 - coils (0xxxx -> 0-based)
  coils = [
    { name = "turbine_running", address = [0] },
    { name = "general_alarm",   address = [1] },
  ]

# --- Scaling: raw tam sayidan gercek muhendislik birimine (Bolum 6 "Olcek/Ornek") ---
[[processors.enum]]
  namepass = ["turbine"]
  [[processors.enum.mapping]]
    field = "operating_state"
    dest = "operating_state_label"
    [processors.enum.mapping.value_mappings]
      0 = "STOPPED"
      1 = "STARTING"
      2 = "RUNNING"
      3 = "FAULT"

[[processors.converter]]
  namepass = ["turbine"]
  [processors.converter.fields]
    float = ["wind_speed_raw", "rotor_speed_raw", "generator_temp_raw"]

[[processors.starlark]]
  namepass = ["turbine"]
  source = '''
def apply(metric):
    # 85 -> 8.5 m/s ; 145 -> 14.5 rpm ; 620 -> 62.0 C  (Bolum 6 olcek)
    if metric.fields.get("wind_speed_raw") != None:
        metric.fields["wind_speed_ms"] = metric.fields.pop("wind_speed_raw") / 10.0
    if metric.fields.get("rotor_speed_raw") != None:
        metric.fields["rotor_speed_rpm"] = metric.fields.pop("rotor_speed_raw") / 10.0
    if metric.fields.get("generator_temp_raw") != None:
        metric.fields["generator_temp_c"] = metric.fields.pop("generator_temp_raw") / 10.0
    return metric
'''

# --- OUTPUT: InfluxDB v2 (firewall container uzerinden - collection_net) ---
# DIKKAT: hedef adres firewall'in kendisidir, influxdb DEGIL.
# Firewall bu trafigi DNAT ile influxdb:8086'ya yonlendirir (bkz. firewall/entrypoint.sh).
[[outputs.influxdb_v2]]
  urls = ["http://firewall:8086"]
  token = "$INFLUXDB_TELEGRAF_TOKEN"
  organization = "$INFLUXDB_INIT_ORG"
  bucket = "$INFLUXDB_INIT_BUCKET"
  timeout = "5s"
