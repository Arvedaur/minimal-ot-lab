apiVersion: 1

datasources:
  - name: InfluxDB-Turbine
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: otlab
      defaultBucket: turbine
      tlsSkipVerify: false
    secureJsonData:
      token: ${INFLUXDB_GRAFANA_TOKEN}
    isDefault: true
    editable: false
